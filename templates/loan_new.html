{% extends "base.html" %}
{% block title %}New Loan{% endblock %}
{% block content %}
<a href="{{ url_for('loans') }}" style="color:#059669;">← Back</a>
<h1>New Loan</h1>
<form method="post">
    <label>Customer *</label>
    <select name="customer_id" required>
        {% for c in customers %}<option value="{{ c.Customer_ID }}">{{ c.Customer_Name }} (#{{ c.Customer_ID }})</option>{% endfor %}
    </select>
    <label>Loan Type *</label>
    <select name="loan_type" required>
        <option>Home</option><option>Car</option><option>Personal</option>
        <option>Education</option><option>Business</option>
    </select>
    <label>Amount (₹) *</label><input name="amount" type="number" step="0.01" min="1" required>
    <label>Interest Rate (%)</label><input name="interest_rate" type="number" step="0.01" value="8.50">
    <label>Duration (months)</label><input name="duration_months" type="number" min="1" value="12">
    <button class="btn">Create Loan</button>
</form>
{% endblock %}
