<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BankDB{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    {% if session.role == 'employee' %}
    <nav class="nav">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('customers') }}">Customers</a>
        <a href="{{ url_for('accounts') }}">Accounts</a>
        <a href="{{ url_for('loans') }}">Loans</a>
        <a href="{{ url_for('branches') }}">Branches</a>
        <a href="{{ url_for('transactions') }}">Transactions</a>
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
    {% endif %}

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="flash-{{ 'error' if cat == 'error' else 'success' }}">{{ msg }}</div>
            <script>window.addEventListener('DOMContentLoaded', () => window.showToast({{ msg|tojson }}, '{{ cat }}'));</script>
          {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
